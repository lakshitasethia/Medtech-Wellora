# Render blueprint for the Wellora heart-risk service.
#
# Deploy: push this repo to GitHub, then in Render choose
#   New > Blueprint  and point it at this file.
#
# rootDir matters — this service lives in a subdirectory of the Wellora repo.
services:
  - type: web
    name: wellora-ml
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Must match the pin in runtime.txt. numpy 1.26.4 has no 3.13 wheels.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Comma-separated origins allowed to call this API from a browser.
      # Replace with your deployed Wellora frontend URL.
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:5273"
