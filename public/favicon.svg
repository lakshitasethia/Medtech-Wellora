<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wellora">
  <defs>
    <linearGradient id="wellora-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile, matching .brand-logo-wrapper in the app navbar -->
  <rect width="64" height="64" rx="16" fill="url(#wellora-mark)"/>

  <!-- lucide "activity" pulse, centred and scaled to fill the tile -->
  <g transform="translate(12.8 12.8) scale(1.6)"
     fill="none" stroke="#FFFFFF" stroke-width="2.25"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  </g>
</svg>
